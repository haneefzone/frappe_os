# FDM Platform — nginx reverse proxy (drop into /etc/nginx/conf.d/fdm.conf
# or link from sites-available; this file must live in the http{} context
# because of the map block below).
#
# SECURITY (SEC-M1): this proxy SETS X-Forwarded-For from $remote_addr — it
# never appends to a client-supplied header — so a spoofed X-Forwarded-For
# from the internet can never reach the app. Pair it with the app-side
# setting in backend/.env:
#
#   TRUSTED_PROXY_IPS=127.0.0.1        # this proxy's address as the app sees it
#   COOKIE_SECURE=true                 # once TLS is terminated here
#
# and (recommended) bind uvicorn to loopback only in the systemd unit
# (--host 127.0.0.1) so clients cannot bypass the proxy. See deploy/README.md.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # Replace with your hostname; add a TLS server block (certbot --nginx
    # will rewrite this one) before exposing to the internet.
    server_name fdm.example.com;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # SET, never append: $proxy_add_x_forwarded_for would preserve a
        # client-forged chain and defeat the login lockout (SEC-M1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # WebSocket (interactive terminal) + SSE (job log tailing).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # The app disables response buffering per-stream via X-Accel-Buffering.
    }
}
