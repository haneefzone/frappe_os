# Postgres + Redis for the PLATFORM's own use (not for managed benches).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fdm
      POSTGRES_PASSWORD: fdm
      POSTGRES_DB: fdm
    ports:
      - "5432:5432"
    volumes:
      - fdm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdm -d fdm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - fdm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fdm-postgres-data:
  fdm-redis-data:
